name: Test site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: site-feedback-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  links:
    name: Build and links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and load test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: codesai-website-test:latest
          cache-from: type=gha,scope=codesai-site-${{ runner.arch }}-${{ hashFiles('Dockerfile') }}
          cache-to: type=gha,mode=max,scope=codesai-site-${{ runner.arch }}-${{ hashFiles('Dockerfile') }}

      - name: Validate build and links
        env:
          CWS_SKIP_DOCKER_BUILD: "1"
        run: make test-links

  production-playwright:
    name: Playwright on production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Wait for the automatic Netlify deploy
        env:
          DEPLOY_META_URL: https://www.codesai.com/deploy-meta.json
        run: |
          for attempt in {1..30}; do
            deployed_commit="$(
              curl --fail --silent --show-error --location \
                --header 'Cache-Control: no-cache' \
                "${DEPLOY_META_URL}?attempt=${attempt}" 2>/dev/null \
                | jq --raw-output '.commit // empty' 2>/dev/null \
                || true
            )"

            if [ "$deployed_commit" = "$GITHUB_SHA" ]; then
              echo "Commit $GITHUB_SHA is now in production"
              exit 0
            fi

            if [ -n "$deployed_commit" ]; then
              echo "Production still contains $deployed_commit (attempt $attempt/30)"
            else
              echo "Production deploy metadata is not available yet (attempt $attempt/30)"
            fi

            if [ "$attempt" -lt 30 ]; then
              sleep 10
            fi
          done

          echo "Commit $GITHUB_SHA did not reach production"
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and load test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: codesai-website-test:latest
          cache-from: type=gha,scope=codesai-site-${{ runner.arch }}-${{ hashFiles('Dockerfile') }}
          cache-to: type=gha,mode=max,scope=codesai-site-${{ runner.arch }}-${{ hashFiles('Dockerfile') }}

      - name: Test production with Playwright
        env:
          CWS_TEST_BASE_URL: https://www.codesai.com
          CWS_SKIP_DOCKER_BUILD: "1"
        run: make test-playwright
