<!DOCTYPE html>
<html lang="{% translate metas.language %}">
<head>

    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>

    <title>{% unless include.translate_title %}{% translate page.title %}{% else %}{{ page.title }}{% endunless %}</title>
    <meta name="description" content="{% translate metas.description %}">

    <meta property="og:site_name" content="Codesai">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="{% translate metas.locale %}">
    <meta property="og:title" content="{% unless include.translate_title %}{% translate page.title %}{% else %}{{ page.title }}{% endunless %}">
    <meta property="og:description" content="{% translate metas.description %}">
    <meta property="og:url" content="{{ site.url }}">
    <meta property="og:image" content="{% if page.small_image %}{{ site.url | append: '/assets/' | append: page.small_image }}{% else %}{{ site.url | append: '/img/new_rich_preview_logo.png' }}{% endif %}">

    <link rel='stylesheet' href='{{ site.baseurl_root }}/sass/main.css' />
    <link rel="preload" href="{{ site.baseurl_root }}/fonts/google/assistant-v24-normal-variable-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ site.baseurl_root }}/fonts/google/lekton-v21-normal-400-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ site.baseurl_root }}/fonts/google/lekton-v21-normal-700-latin.woff2" as="font" type="font/woff2" crossorigin>
    {% if page.title contains 'pages.courses.' %}
    <link rel="preload" href="{{ site.baseurl_root }}/fonts/google/signika-v29-normal-variable-slashes.woff2" as="font" type="font/woff2" crossorigin>
    {% endif %}
</head>

<script>
    const cookiePolicyName = 'codesai_cookie_policy';

    function cookiePolicyChoice() {
        const prefix = cookiePolicyName + '=';
        const cookie = document.cookie.split(';').map(value => value.trim())
            .find(value => value.startsWith(prefix));
        return cookie?.slice(prefix.length);
    }

    function analyticsStorageConsent(choice) {
        return choice === 'accepted' ? 'granted' : 'denied';
    }

    function saveCookiePolicyChoice(choice) {
        const maxAge = 100 * 365 * 24 * 60 * 60;
        document.cookie = `${cookiePolicyName}=${choice}; max-age=${maxAge}; path=/; SameSite=Lax`;
        {% if site.environment == 'production' %}
        gtag('consent', 'update', { analytics_storage: analyticsStorageConsent(choice) });
        {% endif %}
    }

    {% if site.environment == 'production' %}
    window.environment = "production";
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    gtag('consent', 'default', {
        analytics_storage: analyticsStorageConsent(cookiePolicyChoice()),
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied'
    });
    gtag('js', new Date());
    gtag('config', '{{ site.ga_tracking_id }}');

    // Keep events queued while the first screen and its fonts are painted.
    // Loading analytics afterwards avoids competing with that rendering work.
    let analyticsStarted = false;
    function loadAnalytics() {
        if (analyticsStarted) return;
        analyticsStarted = true;
        const script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id={{ site.ga_tracking_id }}';
        document.head.appendChild(script);
    }

    function scheduleAnalytics() {
        if (document.visibilityState === 'hidden') {
            loadAnalytics();
            return;
        }
        const firstPaint = new Promise(resolve => {
            if ('PerformanceObserver' in window && PerformanceObserver.supportedEntryTypes &&
                PerformanceObserver.supportedEntryTypes.includes('paint')) {
                const observer = new PerformanceObserver(list => {
                    if (list.getEntries().some(entry => entry.name === 'first-contentful-paint')) {
                        observer.disconnect();
                        resolve();
                    }
                });
                observer.observe({ type: 'paint', buffered: true });
            } else {
                requestAnimationFrame(() => setTimeout(resolve, 0));
            }
        });
        firstPaint
            .then(() => document.fonts ? document.fonts.ready : Promise.resolve())
            .then(() => requestAnimationFrame(() => setTimeout(loadAnalytics, 0)));
    }

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') loadAnalytics();
    });
    document.addEventListener('DOMContentLoaded', scheduleAnalytics, { once: true });
    {% endif %}
</script>
